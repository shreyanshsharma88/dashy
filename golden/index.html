<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div id="read-progress" aria-hidden="true"><span></span></div>
<header class="topbar">
  <div class="brand"><span id="brand-subject">Study</span> Dashboard</div>
  <input id="search" type="search" placeholder="Search all lectures…  ( / )" autocomplete="off" aria-label="Search lectures">
  <div class="top-actions">
    <button id="btn-font-dec" title="Smaller text" aria-label="Smaller text">A−</button>
    <button id="btn-font-inc" title="Larger text" aria-label="Larger text">A+</button>
    <button id="btn-lh" title="Cycle line height" aria-label="Cycle line height">LH</button>
    <button id="btn-theme" title="Theme: dark / sepia / light" aria-label="Change theme" aria-pressed="false">◐</button>
    <button id="btn-focus" title="Focus mode (F)" aria-label="Toggle focus mode" aria-pressed="false">⛶</button>
    <button id="btn-pdf" title="Reference PDF window" aria-label="Toggle reference PDF window" aria-pressed="true">📄</button>
    <button id="btn-timer" title="Pomodoro timer" aria-label="Toggle Pomodoro timer" aria-pressed="false">⏱</button>
    <button id="btn-keys" title="Keyboard shortcuts (?)" aria-label="Show keyboard shortcuts">?</button>
  </div>
  <div class="progress-wrap"><div id="progress-bar"></div><span id="progress-label"></span></div>
</header>
<div id="keys-pop" hidden>
  <b>Shortcuts</b>
  <div><kbd>←</kbd><kbd>→</kbd> prev / next lecture</div>
  <div><kbd>F</kbd> focus mode &nbsp; <kbd>/</kbd> search &nbsp; <kbd>Esc</kbd> close</div>
</div>
<div id="search-results" hidden role="status"></div>
<div class="layout">
  <aside id="sidebar">
    <nav id="nav" aria-label="Dashboard pages"></nav>
    <h3>Studied</h3>
    <div id="studied-list"></div>
    <h3>Weak list <span id="weak-count"></span></h3>
    <div id="weak-list" class="weak-list"></div>
  </aside>
  <div class="content-wrap">
    <main id="view"></main>
    <aside id="toc" aria-label="On this page"><b>On this page</b><div id="toc-list"></div></aside>
  </div>
</div>
<nav id="dots" aria-label="Lecture position"></nav>
<div class="sr-only" role="status" id="sr-status"></div>
<aside id="pdfwin" hidden aria-label="Reference PDF">
  <div id="pdf-grip" title="Drag to resize"></div>
  <div class="pdf-head"><b id="pdf-title">Reference PDF</b>
    <span id="pdf-page" class="src"></span>
    <button id="pdf-open" title="Open full PDF in new tab">↗</button>
    <button id="pdf-hide" title="Hide">×</button>
  </div>
  <iframe id="pdf-frame" title="Reference PDF"></iframe>
  <div class="pdf-fallback src">PDF not showing? <a id="pdf-link" href="#" target="_blank" rel="noopener">open it directly</a>.</div>
</aside>
<div id="timer" hidden>
  <div class="tm-head"><b id="tm-mode">Focus 25</b><button id="tm-hide" title="Hide timer">×</button></div>
  <div id="tm-time">25:00</div>
  <div class="tm-row">
    <button id="tm-start">Start</button>
    <button id="tm-reset" class="ghost">Reset</button>
  </div>
  <div class="tm-row">
    <button id="tm-m25" class="ghost on">25/5</button>
    <button id="tm-m50" class="ghost">50/10</button>
  </div>
  <div id="tm-count" class="src"></div>
</div>
<script src="app-data.js"></script>
<script src="media.js"></script>
<script src="app.js"></script>
</body>
</html>
